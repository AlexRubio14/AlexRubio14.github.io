name: Contact worker

on:
  push:
    branches: [main]
    paths: ['workers/contact/**', '.github/workflows/worker.yml']
  pull_request:
    paths: ['workers/contact/**', '.github/workflows/worker.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: workers/contact

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/contact/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir dist # validates config + bundle

  deploy:
    # Needs the CLOUDFLARE_API_TOKEN repository secret ("Edit Cloudflare Workers" template).
    # Resend key and destination email are Worker secrets, set once with `npm run secrets`.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Skip if Cloudflare is not configured yet
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN secret not set - skipping deploy (deploy manually with 'npm run deploy')."
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/contact/package-lock.json
      - run: npm ci
        if: env.CLOUDFLARE_API_TOKEN != ''
      - run: npx wrangler deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
