<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | Alejandro Rubio Plana</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#07090D" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- CSS as <link> in the head, not imported from JS: the browser waits for it before the
         first paint, so the page never shows unstyled (in dev or in production). -->
    <link rel="stylesheet" href="/src/styles/main.css" />
    <link rel="stylesheet" href="/src/styles/pages/case-study.css" />
    <!-- Visitors who picked ES/CA: hide the page until the translation is applied, so they never
         see the English text swap. i18n.js removes the class; the timeout is a safety net. -->
    <script>
      try {
        var lang = localStorage.getItem('portfolio_lang');
        if (lang === 'es' || lang === 'ca') {
          document.documentElement.classList.add('i18n-pending');
          setTimeout(function () {
            document.documentElement.classList.remove('i18n-pending');
          }, 1500);
        }
      } catch (e) {}
    </script>
    <style>
      .i18n-pending body {
        visibility: hidden;
      }
    </style>
    <script type="module" src="/src/scripts/pages/not-found.js"></script>
  </head>
  <body>
    <!-- @include nav-project.html back="/" -->

    <main id="main" class="project-hero">
      <div class="wrap">
        <div class="project-hero-inner">
          <span class="project-tag">// ERROR 404</span>
          <h1 class="project-title" data-i18n="notfound.title">Packet lost.</h1>
          <p class="project-lede" data-i18n="notfound.lede">
            The page you are looking for doesn't exist or has moved. No retransmission scheduled.
          </p>
          <div class="hero-cta-wrapper">
            <a href="/" class="btn-action primary" data-i18n="nav.back">← Back to portfolio</a>
          </div>
        </div>
      </div>
    </main>

    <!-- @include contact-drawer.html -->
  </body>
</html>
