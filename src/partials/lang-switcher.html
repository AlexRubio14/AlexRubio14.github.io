<div class="nav-toggles">
  <button
    type="button"
    class="nav-lang-btn"
    id="lang-toggle"
    aria-haspopup="true"
    aria-expanded="false"
    aria-controls="lang-menu"
  >
    <!-- The accessible name ("Language EN") must contain the visible text ("EN"). -->
    <span class="visually-hidden" data-i18n="nav.lang_name">Language</span>
    <span id="lang-label">EN</span>
    <span aria-hidden="true">▾</span>
  </button>
  <ul class="lang-menu" id="lang-menu" role="menu">
    <li role="none"><button type="button" role="menuitemradio" data-lang="en" lang="en">English</button></li>
    <li role="none"><button type="button" role="menuitemradio" data-lang="es" lang="es">Español</button></li>
    <li role="none"><button type="button" role="menuitemradio" data-lang="ca" lang="ca">Català</button></li>
  </ul>
</div>
