# Cloudflare Worker that receives the portfolio contact form and emails it via Resend.
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/
name = "portfolio-contact"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Exposed at https://portfolio-contact.<your-subdomain>.workers.dev
workers_dev = true

[vars]
# Origins allowed to call the API (CORS). Comma-separated.
ALLOWED_ORIGINS = "https://alexrubio14.github.io,http://localhost:5173,http://localhost:4173"
# Sender shown in your inbox. Without a verified domain Resend only allows onboarding@resend.dev,
# and only delivers to the address of your own Resend account (which is exactly what a contact form needs).
MAIL_FROM = "Portfolio <onboarding@resend.dev>"

# Secrets (never committed). Set them once with:  npm run secrets
#   RESEND_API_KEY  -> API key from https://resend.com/api-keys ("Sending access" is enough)
#   CONTACT_TO      -> where messages arrive; must be your Resend account email
